name: Deploy to GitHub Pages

on:
  push:
    branches: [web-wasm-static-site]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # build:wasm runs `cargo build --target wasm32-unknown-unknown` + `wasm-bindgen`.
      # Pin wasm-bindgen-cli to the exact version resolved in Cargo.lock.
      - name: Install wasm-bindgen-cli
        run: |
          VERSION=$(grep -A1 'name = "wasm-bindgen"' rsolver/Cargo.lock | grep -m1 version | cut -d'"' -f2)
          cargo install wasm-bindgen-cli --version "$VERSION"

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Bundle puzzle data
        working-directory: web
        run: npm run data

      - name: Build site + wasm
        working-directory: web
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
